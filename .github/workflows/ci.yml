name: CI — Lint + Testes

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências de lint
        run: pip install ruff

      - name: Executar Ruff
        run: ruff check .

  test:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    needs: lint
    env:
      JWT_SECRET_KEY: "ci-test-secret-key-must-be-at-least-32-chars-long"
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Executar testes com cobertura
        run: |
          pytest tests/ \
            --cov=src --cov=api \
            --cov-omit="tests/*,.venv/*" \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      - name: Upload de cobertura para Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t orgatec-api:test .

      - name: Verificar imagem
        run: docker images orgatec-api:test
