version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: nfa_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-nfa_extractor}
    ports:
      - "5432:5432"
    volumes:
      - nfa_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  nfa_pgdata:
