services:
  postgres:
    image: postgres:15-alpine
    container_name: nfa_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no config.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no config.env}
      POSTGRES_DB: ${POSTGRES_DB:-nfa_extractor}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nfa_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nfa_pgdata:
