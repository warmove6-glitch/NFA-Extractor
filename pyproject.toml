[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
omit = [
    "app.py",
    "pdf_report.py",
    ".venv/*",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "__pycache__", "dist", "build"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # linha longa (ruff format cuida disso)
    "B008",  # não usar chamadas de função em argumentos default
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_strict_optional = true
warn_return_any = false
warn_unused_ignores = true

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
